<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>油价查询</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"Microsoft YaHei",sans-serif; background:#f0f2f5; }
  .tab-bar {
    display:flex; gap:4px; padding:0 24px;
    background:#fff; border-bottom:1px solid #e4e7ed;
    position:sticky; top:0; z-index:100;
  }
  .tab {
    padding:14px 24px; cursor:pointer; font-size:15px; color:#5a6b7b;
    border-bottom:3px solid transparent; transition:.15s; user-select:none;
  }
  .tab:hover { color:#409eff; }
  .tab.active { color:#c9302c; border-bottom-color:#c9302c; font-weight:600; }
  .pane { display:none; }
  .pane.active { display:block; }
  iframe { width:100%; border:none; display:block; }

  .mode-btn, .range-btn {
    padding:6px 18px; margin:0 6px; border:1px solid #dcdfe6;
    background:#fff; border-radius:4px; cursor:pointer; font-size:13px;
    color:#5a6b7b;
  }
  .mode-btn.active, .range-btn.active { background:#409eff; color:#fff; border-color:#409eff; }

  .filter-bar {
    display:flex; justify-content:center; align-items:center; gap:12px;
    margin: 16px 0 8px; flex-wrap:wrap;
  }
  .filter-bar label { font-size:13px; color:#5a6b7b; }
  .filter-bar input[type="date"] {
    padding:6px 10px; border:1px solid #dcdfe6; border-radius:4px;
    font-size:13px; color:#1f2d3d;
  }
  .filter-bar button {
    padding:6px 16px; border:1px solid #dcdfe6; background:#fff;
    border-radius:4px; cursor:pointer; font-size:13px; color:#5a6b7b;
  }
  .filter-bar button:hover { border-color:#409eff; color:#409eff; }

  .delta-row {
    display:flex; justify-content:center; gap:32px;
    margin: 0 0 14px; flex-wrap:wrap;
  }
  .delta-item {
    font-size:13px; color:#5a6b7b;
    background:#f7f9fc; padding:6px 14px; border-radius:4px;
  }
  .delta-item b { font-weight:600; }
  .up   { color:#e74c3c; }
  .down { color:#27ae60; }
  .flat { color:#8492a6; }
</style>
</head>
<body>

<div class="tab-bar">
  <div class="tab active" data-tab="domestic">全国各省市油价</div>
  <div class="tab" data-tab="intl">国际原油</div>
</div>

<div class="pane active" id="pane-domestic">
  <iframe src="国内/domestic.html" style="height:calc(100vh - 52px);"></iframe>
</div>

<div class="pane" id="pane-intl">
  <div style="padding:24px;max-width:1100px;margin:0 auto;">

    <h1 style="text-align:center;font-size:26px;margin:8px 0 24px;font-weight:600;">
      国际油价今日行情
    </h1>

    <div class="filter-bar">
      <label>查看日期：</label>
      <input type="date" id="datePicker">
      <button id="resetDateBtn">重置（最新）</button>
    </div>

    <table style="width:100%;border-collapse:collapse;background:#fff;font-size:15px;">
      <thead>
        <tr>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">国际（美元）</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">当前</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">较今开</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">今开</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">昨收</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">昨收最高</th>
          <th style="padding:14px;border:1px solid #e4e7ed;color:#27ae60;font-weight:600;">昨收最低</th>
        </tr>
      </thead>
      <tbody id="intlTableBody">
        <tr><td colspan="7" style="padding:20px;text-align:center;color:#8492a6;">加载中...</td></tr>
      </tbody>
    </table>
    <div id="intlTime" style="text-align:right;font-size:12px;color:#b0b8c1;margin-top:8px;"></div>

    <div style="margin-top:36px;">
      <div style="text-align:center;margin-bottom:8px;">
        <button class="mode-btn active" data-mode="h24">24小时走势图</button>
        <button class="mode-btn" data-mode="day">日价格波动率</button>
        <button class="mode-btn" data-mode="month">月价格波动率</button>
      </div>

      <div style="text-align:center;margin-bottom:16px;display:none;" id="rangeBar">
        <button class="range-btn active" data-range="7">近一周</button>
        <button class="range-btn" data-range="30">近一月</button>
        <button class="range-btn" data-range="365">近一年</button>
      </div>

      <h2 id="chartTitle" style="text-align:center;font-size:18px;margin:0 0 8px;font-weight:600;">
        加载中…
      </h2>

      <div class="delta-row" id="deltaRow"></div>

      <div id="priceChart" style="width:100%;height:440px;"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script>
// ============== 页签切换 ==============
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('pane-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'intl') {
      setTimeout(() => priceChart && priceChart.resize(), 50);
    }
  };
});

let priceChart = null;
let currentMode = 'h24';
let currentRange = 7;
let selectedDate = null;

let minlineData = null;
let monthlyData = null;

const COLOR = {
  'WTI美国': '#409eff',
  '布伦特': '#e6a23c',
  'WTI纽约原油': '#409eff',
  '布伦特油': '#e6a23c',
  'OPEC一揽子': '#27ae60',
};

// ============== 数据加载 ==============
async function loadMinline() {
  try {
    const res = await fetch('国际/oil_minline.json?_=' + Date.now());
    minlineData = await res.json();
    renderAll();
    document.getElementById('intlTime').textContent = '更新时间：' + minlineData.update_time;
  } catch (e) {
    document.getElementById('intlTableBody').innerHTML =
      '<tr><td colspan="7" style="padding:20px;text-align:center;color:#e74c3c;">读取 国际/oil_minline.json 失败</td></tr>';
  }
}

async function loadMonthly() {
  try {
    const res = await fetch('国际/oil_monthly.json?_=' + Date.now());
    monthlyData = await res.json();
    setupDatePickerRange();
    renderAll();
  } catch (e) {
    console.warn('oil_monthly.json 加载失败', e);
  }
}

// ============== 日期筛选器 ==============
function setupDatePickerRange() {
  const input = document.getElementById('datePicker');
  if (!monthlyData || !monthlyData.series) return;

  let minD = null, maxD = null;
  Object.values(monthlyData.series).forEach(arr => {
    arr.forEach(([d]) => {
      if (!minD || d < minD) minD = d;
      if (!maxD || d > maxD) maxD = d;
    });
  });
  if (!minD || !maxD) return;
  input.min = minD;
  input.max = maxD;
}

function onDateChange() {
  selectedDate = document.getElementById('datePicker').value || null;
  renderAll();
}

function resetDate() {
  document.getElementById('datePicker').value = '';
  selectedDate = null;
  renderAll();
}

document.getElementById('datePicker').addEventListener('change', onDateChange);
document.getElementById('resetDateBtn').addEventListener('click', resetDate);

// ============== 工具 ==============
function getSeriesClose(symbol, date) {
  if (!monthlyData || !monthlyData.series) return null;
  const arr = monthlyData.series[symbol] || [];
  for (let i = 0; i < arr.length; i++) {
    if (arr[i][0] === date) return arr[i][1];
  }
  return null;
}

function getLatestHistoryDate() {
  if (!monthlyData || !monthlyData.series) return null;
  let maxD = null;
  Object.values(monthlyData.series).forEach(arr => {
    arr.forEach(([d]) => { if (!maxD || d > maxD) maxD = d; });
  });
  return maxD;
}

function getPrevHistoryDate(symbol, date) {
  if (!monthlyData || !monthlyData.series) return null;
  const arr = monthlyData.series[symbol] || [];
  let prev = null;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i][0] === date) return prev;
    prev = arr[i][0];
  }
  return null;
}

function getDailyDetail(symbol, date) {
  if (!monthlyData || !monthlyData.dailyDetail) return null;
  const m = monthlyData.dailyDetail[symbol];
  if (!m) return null;
  return m[date] || null;
}

function getPrevDailyDetail(symbol, latestDate) {
  const prevDate = getPrevHistoryDate(symbol, latestDate);
  if (!prevDate) return null;
  return { date: prevDate, detail: getDailyDetail(symbol, prevDate) };
}

// ============== 表格 ==============
function renderTable() {
  const tbody = document.getElementById('intlTableBody');
  tbody.innerHTML = '';

  const order = [
    { key: '布伦特', historyKey: '布伦特油' },
    { key: 'WTI美国', historyKey: 'WTI纽约原油' },
  ];

  for (const item of order) {
    if (!selectedDate) {
      const pts = (minlineData && minlineData.series[item.key]) || [];
      const meta = (minlineData && minlineData.meta && minlineData.meta[item.key]) || {};

      if (!pts.length) {
        tbody.innerHTML += `<tr>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#27ae60;font-weight:600;">${item.key}</td>
          <td colspan="6" style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#c0c4cc;">无数据</td>
        </tr>`;
        continue;
      }

      const cur = pts[pts.length - 1][1];
      const open = meta.open;

      const latestHist = getLatestHistoryDate();
      const prevInfo = latestHist ? getPrevDailyDetail(item.historyKey, latestHist) : null;
      const prevClose = prevInfo && prevInfo.detail ? prevInfo.detail.close : null;
      const prevHigh  = prevInfo && prevInfo.detail ? prevInfo.detail.high  : null;
      const prevLow   = prevInfo && prevInfo.detail ? prevInfo.detail.low   : null;

      let pctText = '—';
      if (open != null && !isNaN(open) && open !== 0) {
        const diff = cur - open;
        const pct = (diff / open) * 100;
        const up = diff > 0, down = diff < 0;
        const color = up ? '#e74c3c' : down ? '#27ae60' : '#8492a6';
        const sign = up ? '+' : '';
        pctText = `<span style="color:${color};font-weight:600;">${sign}${diff.toFixed(2)}</span>
                   <span style="color:${color};font-size:13px;">（${sign}${pct.toFixed(2)}%）</span>`;
      }

      const fmt = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(2);

      tbody.innerHTML += `
        <tr>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#27ae60;font-weight:600;">${item.key}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;font-weight:600;">${cur.toFixed(2)}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${pctText}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${fmt(open)}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${fmt(prevClose)}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${fmt(prevHigh)}</td>
          <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${fmt(prevLow)}</td>
        </tr>`;
    } else {
      const close = getSeriesClose(item.historyKey, selectedDate);
      const prevDate = getPrevHistoryDate(item.historyKey, selectedDate);
      const prevClose = prevDate ? getSeriesClose(item.historyKey, prevDate) : null;
      const prevDetail = prevDate ? getDailyDetail(item.historyKey, prevDate) : null;

      const fmt = v => (v == null || isNaN(v)) ? '—' : Number(v).toFixed(2);

      if (close == null) {
        tbody.innerHTML += `
          <tr>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#27ae60;font-weight:600;">${item.key}</td>
            <td colspan="6" style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#c0c4cc;">${selectedDate} 无数据</td>
          </tr>`;
      } else {
        tbody.innerHTML += `
          <tr>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;color:#27ae60;font-weight:600;">${item.key}</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;font-weight:600;">${close.toFixed(2)}</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">—</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">—</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${fmt(prevClose)}</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${prevDetail ? fmt(prevDetail.high) : '—'}</td>
            <td style="padding:14px;border:1px solid #e4e7ed;text-align:center;">${prevDetail ? fmt(prevDetail.low)  : '—'}</td>
          </tr>`;
      }
    }
  }
}

function fmtDateMD(d) { return d ? d.replace(/-/g, '/') : ''; }

// ============== 图 1：24 小时 ==============
function renderChart24h() {
  const data = minlineData;
  if (!data || !data.series) {
    document.getElementById('chartTitle').textContent = '24小时走势图（无数据）';
    priceChart.clear();
    document.getElementById('deltaRow').innerHTML = '';
    return;
  }

  const latestHist = getLatestHistoryDate();
  if (selectedDate && selectedDate !== latestHist) {
    document.getElementById('chartTitle').textContent =
      `${fmtDateMD(selectedDate)} 无 24 小时分时数据`;
    priceChart.clear();
    document.getElementById('deltaRow').innerHTML = '';
    return;
  }

  const names = Object.keys(data.series);
  const colors = COLOR;

  let xData = [];
  names.forEach(n => {
    const t = (data.series[n] || []).map(p => p[0]);
    if (t.length > xData.length) xData = t;
  });

  const today = new Date();
  const yest = new Date(today);
  yest.setDate(yest.getDate() - 1);
  const yestStr = `${yest.getFullYear()}/${String(yest.getMonth()+1).padStart(2,'0')}/${String(yest.getDate()).padStart(2,'0')}`;

  const xLabels = xData.map((t, i) => {
    if (i > 0 && t < xData[i - 1]) return `${yestStr} ${t}`;
    return t;
  });

  const series = names.map(name => {
    const map = {};
    (data.series[name] || []).forEach(p => { map[p[0]] = p[1]; });
    return {
      name,
      type: 'line', smooth: true, symbol: 'none', connectNulls: false,
      lineStyle: { width: 1.6, color: colors[name] || '#999' },
      itemStyle: { color: colors[name] || '#999' },
      data: xData.map(t => (t in map) ? map[t] : null)
    };
  });

  // 标题日期用 oil_minline.json 的 update_time
  let lastDateStr;
  if (data.update_time) {
    const d = data.update_time.slice(0, 10);
    lastDateStr = d.replace(/-/g, '/');
  } else {
    lastDateStr = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;
  }
  document.getElementById('chartTitle').textContent =
    `${lastDateStr} 的原油价格图（24小时走势）`;

  renderDeltaRow('h24');

  priceChart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: function (params) {
        let rawTime = params[0].axisValue;
        const m = rawTime.match(/\d{2}:\d{2}$/);
        if (m) rawTime = m[0];
        let html = `时间：${rawTime}（北京时间）<br/>`;
        params.forEach(p => {
          if (p.value != null) html += `${p.marker}${p.seriesName}：${p.value.toFixed(2)} 美元/桶<br/>`;
        });
        return html;
      }
    },
    legend: { top: 0, data: names },
    grid: { left: 60, right: 30, top: 40, bottom: 60 },
    xAxis: {
      type: 'category', data: xLabels,
      axisLabel: { fontSize: 11, interval: Math.max(0, Math.floor(xLabels.length / 12) - 1) }
    },
    yAxis: { type: 'value', name: '美元/桶', scale: true },
    series
  }, true);
  priceChart.resize();
}

// ============== 图 2：日价格 ==============
function renderDayChart() {
  const data = monthlyData;
  if (!data || !data.series) {
    document.getElementById('chartTitle').textContent = '日价格波动率（无数据）';
    priceChart.clear();
    document.getElementById('deltaRow').innerHTML = '';
    return;
  }

  if (selectedDate) {
    const names = ['WTI纽约原油', '布伦特油'];
    const series = names.map(name => {
      const close = getSeriesClose(name, selectedDate);
      return {
        name,
        type: 'line',
        symbol: 'circle', symbolSize: 10,
        lineStyle: { width: 2, color: COLOR[name] },
        itemStyle: { color: COLOR[name] },
        data: close == null ? [null] : [close]
      };
    });

    document.getElementById('chartTitle').textContent =
      `${fmtDateMD(selectedDate)} 的原油价格图（日价格波动率）`;
    document.getElementById('deltaRow').innerHTML = '';

    priceChart.setOption({
      tooltip: { trigger: 'axis' },
      legend: { top: 0, data: names },
      grid: { left: 60, right: 30, top: 40, bottom: 60 },
      xAxis: { type: 'category', data: [selectedDate] },
      yAxis: { type: 'value', name: '美元/桶', scale: true },
      series
    }, true);
    priceChart.resize();
    return;
  }

  const names = ['WTI纽约原油', '布伦特油'];
  const allDates = new Set();
  names.forEach(n => (data.series[n] || []).forEach(p => allDates.add(p[0])));
  const sortedDates = Array.from(allDates).sort();
  const xData = sortedDates.slice(-currentRange);

  const series = names.map(name => {
    const map = {};
    (data.series[name] || []).forEach(p => { map[p[0]] = p[1]; });
    return {
      name,
      type: 'line', smooth: true, symbol: 'circle', symbolSize: 4,
      connectNulls: true,
      lineStyle: { width: 2, color: COLOR[name] },
      itemStyle: { color: COLOR[name] },
      data: xData.map(t => (t in map) ? map[t] : null)
    };
  });

  const rangeText = currentRange === 7 ? '近一周' : currentRange === 30 ? '近一月' : '近一年';
  document.getElementById('chartTitle').textContent =
    `${fmtDateMD(xData[0])} ~ ${fmtDateMD(xData[xData.length - 1])} 的原油价格图（日价格波动率 · ${rangeText}）`;
  document.getElementById('deltaRow').innerHTML = '';

  priceChart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { top: 0, data: names },
    grid: { left: 60, right: 30, top: 40, bottom: 70 },
    xAxis: {
      type: 'category', data: xData,
      axisLabel: { fontSize: 11, rotate: 30 }
    },
    yAxis: { type: 'value', name: '美元/桶', scale: true },
    series
  }, true);
  priceChart.resize();
}

// ============== 图 3：月价格 ==============
function renderMonthChart() {
  const data = monthlyData;
  if (!data || !data.series) {
    document.getElementById('chartTitle').textContent = '月价格波动率（无数据）';
    priceChart.clear();
    document.getElementById('deltaRow').innerHTML = '';
    return;
  }

  const names = ['WTI纽约原油', '布伦特油'];

  if (selectedDate) {
    const month = selectedDate.slice(0, 7);
    const series = names.map(name => {
      const arr = (data.series[name] || []).filter(p => p[0].startsWith(month));
      const avg = arr.length ? arr.reduce((s, p) => s + p[1], 0) / arr.length : null;
      return {
        name,
        type: 'line',
        symbol: 'circle', symbolSize: 10,
        lineStyle: { width: 2, color: COLOR[name] },
        itemStyle: { color: COLOR[name] },
        data: avg == null ? [null] : [avg]
      };
    });

    document.getElementById('chartTitle').textContent =
      `${fmtDateMD(selectedDate)}（${month} 月均值）的原油价格图（月价格波动率）`;
    document.getElementById('deltaRow').innerHTML = '';

    priceChart.setOption({
      tooltip: { trigger: 'axis' },
      legend: { top: 0, data: names },
      grid: { left: 60, right: 30, top: 40, bottom: 60 },
      xAxis: { type: 'category', data: [month] },
      yAxis: { type: 'value', name: '美元/桶', scale: true },
      series
    }, true);
    priceChart.resize();
    return;
  }

  const monthMap = {};
  names.forEach(name => {
    (data.series[name] || []).forEach(([d, v]) => {
      const m = d.slice(0, 7);
      if (!monthMap[m]) monthMap[m] = {};
      if (!monthMap[m][name]) monthMap[m][name] = [0, 0];
      monthMap[m][name][0] += v;
      monthMap[m][name][1] += 1;
    });
  });

  const allMonths = Object.keys(monthMap).sort();
  const xData = allMonths.slice(-12);

  const series = names.map(name => ({
    name,
    type: 'line', smooth: true, symbol: 'circle', symbolSize: 6,
    connectNulls: true,
    lineStyle: { width: 2, color: COLOR[name] },
    itemStyle: { color: COLOR[name] },
    data: xData.map(m => {
      const cell = monthMap[m] && monthMap[m][name];
      return cell && cell[1] > 0 ? cell[0] / cell[1] : null;
    })
  }));

  document.getElementById('chartTitle').textContent =
    `${fmtDateMD(xData[0] + '-01')} ~ ${fmtDateMD(xData[xData.length - 1] + '-01')} 的原油价格图（月价格波动率 · 月平均）`;
  document.getElementById('deltaRow').innerHTML = '';

  priceChart.setOption({
    tooltip: {
      trigger: 'axis',
      formatter: function (params) {
        let html = `${params[0].axisValue}<br/>`;
        params.forEach(p => {
          if (p.value != null) html += `${p.marker}${p.seriesName}：${p.value.toFixed(2)} 美元/桶<br/>`;
        });
        return html;
      }
    },
    legend: { top: 0, data: names },
    grid: { left: 60, right: 30, top: 40, bottom: 60 },
    xAxis: {
      type: 'category', data: xData,
      axisLabel: { fontSize: 11, rotate: 30 }
    },
    yAxis: { type: 'value', name: '美元/桶', scale: true },
    series
  }, true);
  priceChart.resize();
}

// ============== 波动条（仅 24 小时图） ==============
function renderDeltaRow(mode) {
  const box = document.getElementById('deltaRow');
  box.innerHTML = '';
  if (mode !== 'h24') return;

  const min = minlineData;
  if (!min) return;

  const pairs = [
    { minName: 'WTI美国', label: 'WTI 美国' },
    { minName: '布伦特',   label: '布伦特' },
  ];

  for (const p of pairs) {
    const pts = min.series[p.minName] || [];
    const meta = (min.meta && min.meta[p.minName]) || {};
    if (!pts.length || meta.open == null) continue;

    const cur  = pts[pts.length - 1][1];
    const open = parseFloat(meta.open);
    if (isNaN(open) || open === 0) continue;

    const diff = cur - open;
    const pct = (diff / open) * 100;
    const cls = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
    const sign = diff > 0 ? '+' : '';

    box.innerHTML += `
      <div class="delta-item">
        <b>${p.label}</b>：
        <span class="${cls}">${sign}${diff.toFixed(2)}（${sign}${pct.toFixed(2)}%）</span>
        <span style="color:#b0b8c1;">较今开</span>
      </div>`;
  }
}

// ============== 统一渲染 ==============
function renderAll() {
  renderTable();
  renderPriceChart();
}

function renderPriceChart() {
  if (!priceChart) {
    priceChart = echarts.init(document.getElementById('priceChart'));
  }
  document.getElementById('rangeBar').style.display =
    (currentMode === 'day') ? 'block' : 'none';

  if (currentMode === 'h24')        renderChart24h();
  else if (currentMode === 'day')   renderDayChart();
  else if (currentMode === 'month') renderMonthChart();
}

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentMode = btn.dataset.mode;
    renderPriceChart();
  };
});

document.querySelectorAll('.range-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentRange = parseInt(btn.dataset.range);
    if (currentMode === 'day') renderDayChart();
  };
});

loadMinline();
loadMonthly();
setInterval(loadMinline, 60000);
setInterval(loadMonthly, 3600000);

window.addEventListener('resize', () => priceChart && priceChart.resize());
</script>
