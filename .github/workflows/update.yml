name: Update Oil Prices

on:
  schedule:
    - cron: '*/30 * * * *'      # 每 30 分钟（5 分钟太频繁易被限流）
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests pandas openpyxl beautifulsoup4 lxml

      - name: Run oil_chart.py（国际分时）
        working-directory: 国际
        run: python oil_chart.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Run 测试.py（国内油价）
        working-directory: 国内
        run: python 测试.py
        continue-on-error: true
        timeout-minutes: 10

      - name: Run hk_fuel.py（香港燃油）
        working-directory: 香港
        run: python hk_fuel.py
        continue-on-error: true
        timeout-minutes: 5

      - name: Commit & push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto update $(date -u +'%Y-%m-%d %H:%M:%S')"
          git push
