name: Daily Fuel Price Email

on:
  # ★ 去掉 schedule，避免 GitHub cron 重复触发
  workflow_dispatch:
  repository_dispatch:
    types: [daily-trigger]

permissions:
  contents: write

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests openpyxl

      - name: Send email
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          DAILY_RECEIVERS: ${{ secrets.DAILY_RECEIVERS }}
          ALERT_RECEIVERS: ${{ secrets.ALERT_RECEIVERS }}
        run: python scripts/send_email.py

      - name: Commit alert state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/alert_state.json
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update alert state [skip ci]"
          git push
