name: Daily Oil Price Update

on:
  schedule:
    # 北京时间 8:00 = UTC 00:00
    - cron: '0 0 * * *'
    # 北京时间 13:00 = UTC 05:00
    - cron: '0 5 * * *'
    # 北京时间 21:00 = UTC 13:00
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 国内 - 抓取 + 导出
        working-directory: 国内
        run: python 测试.py

      - name: 国际 - 抓分时 + 更新 Excel
        working-directory: 国际
        run: python oil_chart.py

      - name: 国际 - 导出 JSON
        working-directory: 国际
        run: python oil_monthly.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto update $(date -u +%Y-%m-%d\ %H:%M)"
          git push
